[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-leo-latency-routing"
version = "0.1.0"
description = "Reproducible pipeline for opportunity-aware evidence gating of latency-QoS multi-access selection."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "K Deepak Chowdary"},
  {name = "Suvadip Hazra"},
  {name = "Rajendra Hegadi"},
]

[project.urls]
Repository = "https://github.com/KarusalaDeepak/open-leo-latency-routing"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
