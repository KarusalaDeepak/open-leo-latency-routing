schema_version: 1
cross_profile_pooling: prohibited

evidence_tiers:
  proof_of_method:
    minimum_independent_campaigns: 1
    permits: [mechanism_check, descriptive_shadow_replay]
    does_not_permit: [external_generalization, deployment_release]
  frozen_external_validation:
    minimum_independent_campaigns: 2
    requires:
      - development choices frozen before the external campaign
      - paired decision opportunities
      - campaign-block uncertainty interval with adequate precision
      - calibration and distribution-shift checks
      - explicit switching and execution-cost accounting
    permits: [bounded_external_validation_claim]
    does_not_permit: [universal_generalization]
  conservative_broader_generalization:
    minimum_independent_campaigns: 5
    requires:
      - leave-one-campaign-out assessment
      - multiple acquisition families where available
      - every frozen_external_validation requirement
    interpretation: >-
      This is an optional conservative study profile, not an IEEE rule. Five
      campaigns alone do not establish independence, power, calibration,
      precision, shift robustness, or deployment safety.

profiles:
  commect_archived_canonical_60ms:
    evidence_role: canonical_archived_heterogeneous_access_shadow_replay
    latency_target_ms: 60.0
    permitted_absolute_success_deficit: 0.02
    cvar_quantile: 0.95
    latency_cap_ms: 60000.0
    required_cvar_improvement_ms: 1.0
    datasets:
      - COMMECT
    interpretation: >-
      The canonical profile used by the archived COMMECT gate audit. The
      60000-ms value bounds the statistical endpoint; it does not replace
      missing observations or represent a physical network-delay claim.
      COMMECT contributes one acquisition campaign, so the measured audit
      has insufficient independent support for candidate authorization.

  commect_prospective_60ms:
    evidence_role: prospective_deployment_contract
    latency_target_ms: 60.0
    permitted_absolute_success_deficit: 0.02
    cvar_quantile: 0.90
    latency_cap_ms: 250.0
    required_cvar_improvement_ms: 5.0
    datasets:
      - future_independent_cellular_leo_campaigns
    interpretation: >-
      A prospective operator profile for future independently initiated
      campaigns. It is not retroactively substituted for the canonical
      COMMECT audit and has no reported field-admission result in this paper.

  conext23_external_60ms:
    evidence_role: frozen_external_cellular_leo_gate_audit
    latency_target_ms: 60.0
    permitted_absolute_success_deficit: 0.02
    cvar_quantile: 0.90
    latency_cap_ms: 250.0
    required_cvar_improvement_ms: 5.0
    datasets:
      - CoNEXT23_Satellite_vs_Cellular_UDP_Ping
    interpretation: >-
      The 2023-04-23 collection is development-only. The five separately
      restarted daily collections from 2023-04-24 through 2023-04-28 enter the
      gate once each. They are five campaigns from one acquisition family,
      not five independent datasets. The release does not export the server
      identifier or per-sample LTE-versus-5G labels, so the result is a
      conditional cellular--LEO applicability audit rather than 5G-only or
      deployment validation.

  synthetic_operator_150ms:
    evidence_role: controlled_code_path_and_admission_power_demonstration
    latency_target_ms: 150.0
    permitted_absolute_success_deficit: 0.02
    cvar_quantile: 0.90
    latency_cap_ms: 250.0
    required_cvar_improvement_ms: 5.0
    datasets:
      - generated_three_path_episodes
    interpretation: >-
      A deliberately easier synthetic profile used only to verify that the
      frozen production gate can admit a useful candidate when independent
      evidence is sufficient. It is not a COMMECT result or field evidence.
