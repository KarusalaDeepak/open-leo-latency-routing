schema_version: 1
counting_rule: >-
  A gate campaign must contain synchronized, actionable multi-access candidate
  observations with paired next-interval outcomes and acquisition-provenance
  identifiers. Fully qualified campaigns record the destination server.
  Conditionally qualified campaigns may be counted only under an explicit,
  predeclared missing-provenance assumption. Days, folds, or time blocks from
  one acquisition remain one campaign unless the source records a separately
  restarted field collection. Campaign count, qualification status, and
  acquisition-family count are reported separately.

sources:
  - source: COMMECT
    campaign_id: commect_denmark_drive
    acquisition_family: COMMECT
    concurrent_candidate_paths: true
    concurrent_5g_leo: true
    paired_next_interval_outcomes: true
    actionable_opportunity_audit: true
    gate_qualified: true
    qualification_status: fully_qualified
    role: proof_of_method_and_gate_input
    limitation: One acquisition campaign; repeated folds do not add campaigns.

  - source: CoNEXT23_Satellite_vs_Cellular
    campaign_id: conext23_20230424
    acquisition_family: CoNEXT23_Satellite_vs_Cellular
    concurrent_candidate_paths: true
    concurrent_5g_leo: false_mixed_cellular_technology_labels
    paired_next_interval_outcomes: true
    actionable_opportunity_audit: true
    gate_qualified: true
    qualification_status: conditionally_qualified
    qualification_assumption: &conext_assumption >-
      The side-by-side UDP-Ping paths share a common destination, and daily
      collections are independent and exchangeable under the declared model.
    role: frozen_external_gate_evidence
    limitation: &conext_limitation >-
      Separately restarted daily road-test collection from one acquisition
      family. The release documents a common UDP-Ping application but does not
      export the server identifier or per-sample LTE-versus-5G label.

